{% extends 'base.html' %}

{% block title %}Page Not Found (404) | FurniSpace{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; padding-top: 4rem; text-align: center; margin-bottom: 5rem;">
    <div class="card" style="padding: 3rem;">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔍</div>
        <h1 style="font-size: 2.2rem; margin-bottom: 0.8rem;">404 - Page Not Found</h1>
        <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6;">
            The furniture piece, page, or resource you are looking for does not exist or may have been relocated.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="{{ url_for('shop.home') }}" class="btn btn-primary">Return Home</a>
            <a href="{{ url_for('shop.index') }}" class="btn btn-secondary">Browse Catalogue</a>
        </div>
    </div>
</div>
{% endblock %}
