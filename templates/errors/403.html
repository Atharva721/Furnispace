{% extends 'base.html' %}

{% block title %}Access Denied (403) | FurniSpace{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; padding-top: 4rem; text-align: center; margin-bottom: 5rem;">
    <div class="card" style="padding: 3rem;">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔒</div>
        <h1 style="font-size: 2.2rem; margin-bottom: 0.8rem;">403 - Access Denied</h1>
        <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6;">
            You do not have permission to access this administrative resource. Server-side role protection is active.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="{{ url_for('shop.home') }}" class="btn btn-primary">Return Home</a>
            <a href="{{ url_for('admin.login') }}" class="btn btn-secondary">Administrator Login</a>
        </div>
    </div>
</div>
{% endblock %}
