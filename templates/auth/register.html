{% extends 'base.html' %}

{% block title %}Create Account | FurniSpace{% endblock %}

{% block content %}
<div class="container" style="max-width: 560px; margin-top: 3rem; margin-bottom: 3rem;">
    <div class="card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🌿</div>
            <h2>Join FurniSpace</h2>
            <p style="color: var(--text-muted); font-size: 0.92rem;">
                Create a customer account to purchase furniture, sell pre-loved pieces, and track orders.
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="grid-2" style="gap: 1rem;">
                <div class="form-group">
                    <label for="username" class="form-label">Username *</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="e.g. emma_green" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="emma@example.com" required>
                </div>
            </div>

            <div class="grid-2" style="gap: 1rem;">
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Emma Green">
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210">
                </div>
            </div>

            <div class="form-group">
                <label for="address" class="form-label">Default Delivery Address</label>
                <textarea id="address" name="address" class="form-control" style="min-height: 70px;" placeholder="Apartment / Street / City / Pincode"></textarea>
            </div>

            <div class="grid-2" style="gap: 1rem;">
                <div class="form-group">
                    <label for="password" class="form-label">Password * (min. 6 chars)</label>
                    <input type="password" id="password" name="password" class="form-control" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;" id="register-submit-btn">
                Create Account &rarr;
            </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.9rem;">
            <span style="color: var(--text-muted);">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" style="color: var(--accent-olive); font-weight: 600; margin-left: 0.3rem;">
                Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
